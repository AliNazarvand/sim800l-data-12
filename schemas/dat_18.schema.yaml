$schema: http://json-schema.org/draft-07/schema#
title: dat_18 — Certification
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_18_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  certification_body:
    type: string
    enum:
    - CE
    - FCC
    - GCF
    - PTCRB
    - RoHS
    - IC
    - TA
    - RCM
    - Anatel
    - NCC
  certificate_number:
    type: string
  standard:
    type: string
  country:
    type: string
  date_issued:
    type: string
    format: date
  date_expiry:
    type: string
    format: date
  document_link:
    type: string
  related_commands: {}
  related_timings: {}
  related_urcs: {}
  related_pins: {}
  related_states: {}
additionalProperties: true
