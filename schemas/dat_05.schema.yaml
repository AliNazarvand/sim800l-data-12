$schema: "http://json-schema.org/draft-07/schema#"
title: "dat_05 - State Machine"
description: "Schema for dat_05 (State Machine)"
type: object
required: [id, category, source, source_type, confidence, status, applicable_models]
properties:
  id:
    type: string
    pattern: "^dat_05_[0-9]{4}$"
  category:
    type: string
  source:
    type: object
    required: [name, version, date]
    properties:
      name: {type: string}
      version: {type: string}
      date: {type: string}
      page: {type: string}
      section: {type: string}
      quote: {type: string}
  source_type:
    type: string
    enum: [primary, secondary, external]
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum: [complete, partial, unknown, inferred, blocked, deferred, example-only]
  conflicts:
    type: array
    items: {type: object}
  notes:
    type: string
  tags:
    type: array
    items: {type: string}
  applicable_models:
    type: array
    items: {type: string}
    contains: {const: "SIM800L"}
  created_at:
    type: string
  updated_at:
    type: string
additionalProperties: true
  state_name: {type: string}
  description: {type: string}
  entry_conditions:
    type: array
    items: {type: string}
  exit_conditions:
    type: array
    items: {type: string}
  events:
    type: array
    items: {type: string}
  actions:
    type: array
    items: {type: string}
  related_commands:
    type: array
    items: {type: string}
  related_urcs:
    type: array
    items: {type: string}
  related_timings:
    type: array
    items: {type: string}