$schema: "http://json-schema.org/draft-07/schema#"
title: "dat_04 - Timing & Timeout"
description: "Schema for dat_04 (Timing & Timeout)"
type: object
required: [id, category, source, source_type, confidence, status, applicable_models]
properties:
  id:
    type: string
    pattern: "^dat_04_[0-9]{4}$"
  category:
    type: string
  source:
    type: object
    required: [name, version, date]
    properties:
      name: {type: string}
      version: {type: string}
      date: {type: string}
      page: {type: string}
      section: {type: string}
      quote: {type: string}
  source_type:
    type: string
    enum: [primary, secondary, external]
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum: [complete, partial, unknown, inferred, blocked, deferred, example-only]
  conflicts:
    type: array
    items: {type: object}
  notes:
    type: string
  tags:
    type: array
    items: {type: string}
  applicable_models:
    type: array
    items: {type: string}
    contains: {const: "SIM800L"}
  created_at:
    type: string
  updated_at:
    type: string
additionalProperties: true
  parameter: {type: string}
  min: {type: number}
  typ: {type: number}
  max: {type: number}
  unit: {type: string}
  condition: {type: string}
  related_command: {type: string}
  related_state: {type: string}
  related_urc: {type: string}