$schema: "http://json-schema.org/draft-07/schema#"
title: "dat_13 - SIM Management"
description: "Schema for dat_13 (SIM Management)"
type: object
required: [id, category, source, source_type, confidence, status, applicable_models]
properties:
  id:
    type: string
    pattern: "^dat_13_[0-9]{4}$"
  category:
    type: string
  source:
    type: object
    required: [name, version, date]
    properties:
      name: {type: string}
      version: {type: string}
      date: {type: string}
      page: {type: string}
      section: {type: string}
      quote: {type: string}
  source_type:
    type: string
    enum: [primary, secondary, external]
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum: [complete, partial, unknown, inferred, blocked, deferred, example-only]
  conflicts:
    type: array
    items: {type: object}
  notes:
    type: string
  tags:
    type: array
    items: {type: string}
  applicable_models:
    type: array
    items: {type: string}
    contains: {const: "SIM800L"}
  created_at:
    type: string
  updated_at:
    type: string
additionalProperties: true
  category: {type: string}
  command: {type: string}
  syntax: {type: string}
  parameters:
    type: array
    items: {type: object}
  response: {type: string}
  examples:
    type: array
    items: {type: string}
  related_urcs:
    type: array
    items: {type: string}
  hardware_pins:
    type: array
    items: {type: string}