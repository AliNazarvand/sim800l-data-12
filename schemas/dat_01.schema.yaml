$schema: "http://json-schema.org/draft-07/schema#"
title: "dat_01_at_command"
type: object
additionalProperties: true
required: [id, category, source, source_type, confidence, status, applicable_models, created_at, updated_at]
properties:
  id: {type: string}
  category: {type: string}
  source:
    type: object
    required: [name]
    properties:
      name: {type: string}
      version: {type: string}
      date: {type: string}
      page: {type: string}
      section: {type: string}
      quote: {type: string}
  source_type: {type: string, enum: [primary, secondary, external]}
  confidence: {type: number, minimum: 0.0, maximum: 1.0}
  status: {type: string, enum: [complete, partial, unknown, inferred, blocked, deferred]}
  conflicts: {type: array, items: {type: object}}
  notes: {type: string}
  tags: {type: array, items: {type: string}}
  applicable_models:
    type: array
    items: {type: string}
    contains: {const: "SIM800L"}
  created_at: {type: string}
  updated_at: {type: string}
  command: {type: string}
  mode: {type: string}
  syntax: {type: string}
  parameters: {type: array}
  response_success: {type: string}
  response_error: {type: string}
  examples: {type: array}
  related_urcs: {type: array}
  related_states: {type: array}
  related_commands: {type: array}