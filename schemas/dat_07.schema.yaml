$schema: "http://json-schema.org/draft-07/schema#"
title: "dat_07 - Hardware Reference"
description: "Schema for dat_07 (Hardware Reference)"
type: object
required: [id, category, source, source_type, confidence, status, applicable_models]
properties:
  id:
    type: string
    pattern: "^dat_07_[0-9]{4}$"
  category:
    type: string
  source:
    type: object
    required: [name, version, date]
    properties:
      name: {type: string}
      version: {type: string}
      date: {type: string}
      page: {type: string}
      section: {type: string}
      quote: {type: string}
  source_type:
    type: string
    enum: [primary, secondary, external]
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum: [complete, partial, unknown, inferred, blocked, deferred, example-only]
  conflicts:
    type: array
    items: {type: object}
  notes:
    type: string
  tags:
    type: array
    items: {type: string}
  applicable_models:
    type: array
    items: {type: string}
    contains: {const: "SIM800L"}
  created_at:
    type: string
  updated_at:
    type: string
additionalProperties: true
  category: {type: string}
  name: {type: string}
  pin_number: {type: string}
  direction: {type: string}
  voltage_min: {type: number}
  voltage_typ: {type: number}
  voltage_max: {type: number}
  current_typ: {type: number}
  current_max: {type: number}
  function: {type: string}
  alternate_function: {type: string}
  pull_up_down: {type: string}
  esd_rating: {type: string}
  impedance: {type: string}
  decoupling: {type: string}