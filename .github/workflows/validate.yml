name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml jsonschema
      - name: Preflight
        run: python tools/preflight.py || true
      - name: Validate
        run: python scripts/validate.py || true
      - name: Cross-ref
        run: python scripts/cross_ref.py || true
