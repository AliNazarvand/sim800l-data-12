$schema: http://json-schema.org/draft-07/schema#
title: dat_07 — Hardware Reference
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_07_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  name:
    type: string
  pin_number:
    type: array
    items:
      type: integer
  direction:
    type: string
    enum:
    - input
    - output
    - bidirectional
    - power
    - ground
    - analog
  voltage_min:
    type:
    - number
    - 'null'
  voltage_typ:
    type:
    - number
    - 'null'
  voltage_max:
    type:
    - number
    - 'null'
  current_typ:
    type:
    - number
    - 'null'
  current_max:
    type:
    - number
    - 'null'
  function:
    type: string
  alternate_function:
    type: string
  pull_up_down:
    type: string
  esd_rating:
    type: string
  impedance:
    type: string
  decoupling:
    type: string
  parameter:
    type: string
  symbol:
    type: string
  min_value:
    type:
    - integer
    - 'null'
    - number
  typical_value:
    type:
    - 'null'
    - number
  max_value:
    type:
    - 'null'
    - number
  unit:
    type: string
  condition:
    type: string
  notes_fa:
    type: 'null'
  interface_name:
    type: string
  type:
    type: string
  supported_baud_rates:
    type: array
    items:
      type:
      - integer
  pin_mapping:
    type: array
    items:
      type:
      - object
  dimensions_mm:
    type: object
  weight_g:
    type: number
  flash_memory_mbit:
    type: integer
  ram_mbit:
    type: integer
  operating_temperature:
    type: object
  storage_temperature:
    type: object
  pin_name:
    type: string
  description_fa:
    type: string
  voltage_level:
    type:
    - 'null'
    - string
  max_rating:
    type:
    - 'null'
    - string
  mode:
    type: string
  current_typical:
    type:
    - integer
    - number
  related_commands:
    type: array
    items:
      type: string
  related_states:
    type: array
    items:
      type: string
  value_max: {}
  related_timings: {}
  related_urcs: {}
  related_pins: {}
  value_typ: {}
  value_min: {}
additionalProperties: true
