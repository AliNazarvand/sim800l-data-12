$schema: http://json-schema.org/draft-07/schema#
title: dat_13 — SIM Management
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_13_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  command:
    type: string
  syntax:
    type: string
  parameters:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
  response:
    type: string
  examples:
    type: array
    items:
      type: string
  related_urcs:
    type: array
    items:
      type: string
  hardware_pins:
    type: array
    items:
      type: string
  pin_name:
    type: string
  pin_number:
    type: array
    items:
      type:
      - integer
  direction:
    type: string
  function_fa:
    type: string
  parameter:
    type: string
  output_voltage:
    type: string
  output_current_max:
    type: string
  IIH_IIL:
    type: string
  VIH_min_1v8:
    type: string
  VIH_min_3v:
    type: string
  VIL_max:
    type: string
  VOH_min_1v8:
    type: string
  VOH_min_3v:
    type: string
  VOL_max:
    type: string
  notes_fa:
    type: string
  related_commands:
    type: array
    items:
      type: string
  related_timings: {}
  related_pins: {}
  related_states: {}
additionalProperties: true
