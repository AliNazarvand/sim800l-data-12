$schema: http://json-schema.org/draft-07/schema#
title: dat_04 — Timing & Timeout
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_04_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  min:
    type: number
  typ:
    type: number
  max:
    type: number
  unit:
    type: string
  condition:
    type: string
  parameter_id:
    type: string
  parameter_name:
    type: string
  description_fa:
    type: 'null'
  min_value:
    type:
    - integer
    - 'null'
    - number
  typical_value:
    type:
    - 'null'
    - number
  max_value:
    type:
    - 'null'
    - number
  related_pin:
    type: string
  notes_fa:
    type: 'null'
  related_commands:
    type: array
    items:
      type:
      - string
  related_states:
    type: array
    items:
      type:
      - string
  related_timings: {}
  related_urc: {}
  related_urcs: {}
  related_state: {}
  related_pins: {}
  parameter: {}
  related_command: {}
additionalProperties: true
