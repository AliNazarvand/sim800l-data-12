$schema: http://json-schema.org/draft-07/schema#
title: dat_01 — AT Command
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_01_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  command:
    type: string
  mode:
    type: string
    enum:
    - test
    - read
    - write
    - exec
  syntax:
    type: string
  parameters:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
  response_success:
    type: string
  response_error:
    type: string
  examples:
    type: array
    items:
      type: string
  related_urcs:
    type: array
    items:
      type: string
  related_states:
    type: array
    items:
      type: string
  related_commands:
    type: array
    items:
      type: string
  firmware_min:
    type: string
  firmware_max:
    type: string
  responses:
    type: array
    items:
      type:
      - string
  purpose_en:
    type: string
  purpose_fa:
    type: string
  related_timings: {}
  related_pins: {}
additionalProperties: true
