$schema: http://json-schema.org/draft-07/schema#
title: dat_15 — Power Management
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_15_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  mode:
    type: string
  command:
    type: string
  parameter:
    type: string
  value_min:
    type: number
  value_typ:
    type: number
  value_max:
    type: number
  unit:
    type: string
  condition:
    type: string
  wake_source:
    type: string
  related_commands:
    type: array
    items:
      type: string
  related_states:
    type: array
    items:
      type: string
  mode_id:
    type: string
  mode_name:
    type: string
  description_fa:
    type:
    - 'null'
    - string
  current_consumption_typical:
    type:
    - integer
    - 'null'
    - number
  current_consumption_max:
    type:
    - integer
    - 'null'
  entry_condition:
    type:
    - string
    - 'null'
  exit_condition:
    type:
    - string
    - 'null'
  related_pins:
    type: array
    items:
      type:
      - string
additionalProperties: false
