$schema: http://json-schema.org/draft-07/schema#
title: dat_12 — Audio
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_12_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  command:
    type: string
  syntax:
    type: string
  parameters:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
  response:
    type: string
  examples:
    type: array
    items:
      type: string
  related_commands:
    type: array
    items:
      type: string
  pin_name:
    type: string
  pin_number:
    type: array
    items:
      type:
      - integer
  direction:
    type: string
  function_fa:
    type: string
  voltage_level:
    type:
    - 'null'
    - string
  max_rating:
    type:
    - 'null'
    - string
  parameter:
    type: string
  value_at_4_2V:
    type: string
  value_at_3_4V:
    type: string
  unit:
    type: string
  condition:
    type: string
  bias_voltage:
    type: string
  working_current:
    type: string
  input_impedance_differential:
    type: string
  idle_channel_noise:
    type: string
  sinad_at_-40dBm0:
    type: string
  sinad_at_0dBm0:
    type: string
  receiver_output_32ohm_typ:
    type: string
  speaker_output_8ohm_max:
    type: string
  filter_caps_gsm850_egsm900:
    type: string
  filter_caps_dcs1800_pcs1900:
    type: string
  notes_fa:
    type: string
additionalProperties: false
