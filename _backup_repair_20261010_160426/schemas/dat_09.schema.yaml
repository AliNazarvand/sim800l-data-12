$schema: http://json-schema.org/draft-07/schema#
title: dat_09 — SMS
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_09_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  mode:
    type: string
    enum:
    - text
    - pdu
  command:
    type: string
  syntax:
    type: string
  parameters:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
  response:
    type: string
  examples:
    type: array
    items:
      type: string
  related_urcs:
    type: array
    items:
      type: string
  encoding:
    type: string
    enum:
    - GSM7
    - UCS2
    - 8bit
  storage:
    type: string
    enum:
    - SM
    - ME
    - MT
  concat_sms:
    type: boolean
  delivery_report:
    type: boolean
  capability:
    type: string
  description_en:
    type: string
  description_fa:
    type: string
additionalProperties: false
