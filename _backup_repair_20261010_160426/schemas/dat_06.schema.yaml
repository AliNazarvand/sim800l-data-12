$schema: http://json-schema.org/draft-07/schema#
title: dat_06 — Init Sequence
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
    pattern: ^dat_06_[0-9]{4}$
  category:
    type: string
  source:
    type: object
    required:
    - name
    - version
    - date
    properties:
      name:
        type: string
      version:
        type: string
      date:
        type: string
        format: date
      page:
        type: string
      section:
        type: string
      quote:
        type: string
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
    - example-only
  conflicts:
    type: array
    items:
      type: object
  notes:
    type: string
  tags:
    type: array
    items:
      type: string
  applicable_models:
    type: array
    items:
      type: string
    contains:
      const: SIM800L
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  command:
    type: string
  expected_response:
    type: string
  timeout_ms:
    type:
    - integer
    - 'null'
  retry_count:
    type: integer
  failure_action:
    type: string
  dependency_step:
    type: integer
  related_state:
    type: string
  step_number:
    type: integer
  action:
    type: string
  hardware_operation:
    type: string
  expected_result:
    type: string
  critical:
    type: boolean
  notes_fa:
    type: 'null'
  related_states:
    type: array
    items:
      type:
      - string
additionalProperties: false
