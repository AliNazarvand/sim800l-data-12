$schema: "http://json-schema.org/draft-07/schema#"
title: "dat_13"
type: object
required: [id, category, source, source_type, confidence, status, applicable_models, created_at, updated_at]
properties:
  id:
    type: string
    pattern: "^dat_13_[0-9]{4}$"
  category:
    type: string
  source:
    type: object
    required: [name, version]
    properties:
      name: {type: string}
      version: {type: string}
      date: {type: ["string", "null"], format: date}
      page: {type: ["string", "null"]}
      section: {type: ["string", "null"]}
      quote: {type: ["string", "null"]}
  source_type:
    type: string
    enum: [primary, secondary, external]
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum: [complete, partial, unknown, inferred, blocked, deferred, example-only]
  conflicts:
    type: ["array", "null"]
    items: {type: object}
  notes:
    type: ["string", "null"]
  tags:
    type: ["array", "null"]
    items: {type: string}
  applicable_models:
    type: array
    items: {type: string}
    contains: {const: "SIM800L"}
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  command: {type: string}
  syntax: {type: string}
  parameters: {type: array, items: {type: object}}
  response: {type: string}
  examples: {type: array, items: {type: string}}
  related_urcs: {type: array, items: {type: string}}
  hardware_pins: {type: array, items: {type: string}}
