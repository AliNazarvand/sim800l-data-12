- id: dat_05_0010
  category: Operating Mode
  state_name: SLEEP
  description: Module in sleep mode (1 or 2) to minimise current consumption. UART not accessible in sleep mode 1 (until DTR pulled low). Corresponds to SLEEP in V2.02 Table 4.
  entry_conditions:
  - AT+CSCLK=1 and DTR high and no interrupt (Sleep Mode 1)
  - AT+CSCLK=2 and no data over 5 seconds on RXD (Sleep Mode 2)
  exit_conditions:
  - DTR pulled low for about 50 ms (Sleep Mode 1)
  - Data on main serial port (Sleep Mode 2)
  - Incoming voice/data call
  - Incoming SMS
  - External interrupt
  events: []
  actions:
  - Receive paging
  - Receive SMS
  related_commands:
  - AT+CSCLK
